name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - JSON formatter
        - JWT decoder
        - Base64
        - URL encoder/decoder
        - Invoice generator
        - Color converter & contrast checker
        - Unix timestamp converter
        - Shell (theme, command palette, header)
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, ideally with a sample input.
    validations:
      required: true

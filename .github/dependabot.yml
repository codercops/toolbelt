version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next and the OpenNext adapter have to move together. next 16.4.0 on its own
      # (#169) broke every page until @opennextjs/cloudflare 1.20.12 (v0.7.0).
      # Dependabot puts a dependency in the first group it matches, so this one
      # has to stay above dev-dependencies to take eslint-config-next.
      next:
        patterns:
          - "next"
          - "@opennextjs/cloudflare"
          - "eslint-config-next"
      # react-dom refuses to load next to a react of a different version, so a
      # bump of one without the other fails the tests (#224 and #226).
      react:
        patterns:
          - "react"
          - "react-dom"
      dev-dependencies:
        dependency-type: development
    ignore:
      # Major upgrades (Next, React, vitest, lucide, etc.) need manual migration,
      # so keep Dependabot to minor and patch updates plus security fixes.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
